name: Probe Sources

# Manual only. Checks whether candidate data sources are reachable from an
# Actions runner and what shape they return, so fetchers get written against
# evidence rather than documentation. Touches nothing the brief uses.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          # Round 15 needs the real FRED key. scripts/probe.py redacts it from
          # every URL it prints - an Actions log is readable, and a key that
          # reaches one is a key that has to be rotated.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/probe.py
