name: Tests

on:
  push:
    # The brief commits state/latest.json after every send. Running the suite
    # for a data-only commit is pure noise.
    paths-ignore:
      - 'state/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # sources.py imports requests at module scope, so the suite needs the
      # runtime dependencies even though it never touches the network.
      - run: pip install -r requirements.txt
      - run: python tests/test_brief.py
