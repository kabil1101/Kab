name: Daily Market Brief

# GitHub Actions cron is UTC-only. Two slots are registered; the job's own
# guard works out which one lands on 09:xx in Lisbon today and the other one
# exits without sending. That is what keeps delivery at 09:25 Lisbon on both
# sides of every DST switch — Europe and the US change on different dates, so
# a single fixed UTC time would drift by an hour twice a year.
#
#   25 8 UTC -> 09:25 Lisbon while Portugal is on WEST (UTC+1, summer)
#   25 9 UTC -> 09:25 Lisbon while Portugal is on WET  (UTC+0, winter)
#
# Seven days a week. Crypto does not close, and the weekend brief still
# carries funding, open interest, ETF flow runs and the countdown to what is
# coming - it simply has no cash session, which the brief states rather than
# pretending otherwise.
on:
  schedule:
    - cron: "25 8 * * *"
    - cron: "25 9 * * *"
    # And two for the PM delta. These anchor to NEW YORK, not Lisbon: the
    # edition exists to land before the US cash open, which is a New York
    # moment. 12:00 UTC is 08:00 New York while the clocks agree; 13:00 UTC is
    # 08:00 New York in the two weeks a year when they do not. main.py's
    # should_run_pm resolves which slot owns today from the cron expression
    # rather than the wall clock, for the same reason the morning pair does.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      skip_email:
        description: "Build and log the brief without emailing it"
        type: boolean
        default: false
      edition:
        # `pm` builds the delta edition instead of the morning brief. Absent
        # or `am` is every existing caller, unchanged.
        description: "am (default) or pm"
        type: string
        default: ""
      debug:
        description: "Dump today's raw calendar rows to the log"
        type: boolean
        default: false
      trigger_version:
        # The external Apps Script trigger states its own version on every
        # dispatch. The brief compares it against scripts/health.py and says
        # so when they disagree, because the running copy of that script lives
        # in a Google account and is updated by hand - it drifted silently on
        # 12 Sep and cost two briefs. Blank on a dispatch started by a human,
        # which is not evidence of drift and is treated as no claim.
        description: "Version reported by the external trigger (leave blank)"
        type: string
        default: ""

concurrency:
  group: market-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Needed only to commit state/latest.json back. The existing
    # `concurrency: market-brief` group keeps the two daily slots from racing
    # on that file.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-test
        run: python tests/test_brief.py

      - name: Build and send brief
        env:
          # The cron expression that triggered this run. Empty on manual
          # dispatch, which the guard treats as "always run".
          # Not GITHUB_EVENT_SCHEDULE: Actions reserves the GITHUB_ prefix and
          # rejects the whole workflow if you set one.
          BRIEF_SCHEDULE: ${{ github.event.schedule }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SKIP_EMAIL: ${{ inputs.skip_email && '1' || '' }}
          BRIEF_DEBUG: ${{ inputs.debug && '1' || '' }}
          # Only the explicit choice. Resolving the edition from the cron
          # used to happen here, in a ${{ }} expression, and it silently
          # evaluated to an empty string on a scheduled run - so both PM slots
          # ran the morning path and exited on the morning's duplicate guard.
          # main.edition() does it now, where a test can reach it.
          BRIEF_EDITION: ${{ inputs.edition }}
          TRIGGER_VERSION: ${{ inputs.trigger_version }}
          # BACKDROP reads three FRED series. Absent, sources.backdrop raises
          # and the section degrades to a named `unavailable` like any other -
          # which is correct behaviour, and also exactly how this was found:
          # the key was wired into probe.yml and never into the job that
          # actually builds the brief.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python scripts/main.py

      # Yesterday's figures, so tomorrow's brief can show deltas. The daily
      # commit also keeps the repository active, which stops GitHub disabling
      # a scheduled workflow after 60 idle days.
      - name: Persist state
        if: success()
        run: |
          if [[ -z "$(git status --porcelain state/)" ]]; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "State: brief sent $(date -u +%Y-%m-%d)"
          git push
